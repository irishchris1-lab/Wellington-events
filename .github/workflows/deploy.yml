name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # manual redeploy — no need for empty "trigger Pages" commits

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # validate.js uses only the Node standard library, so there is
      # nothing to install — sharp is needed to *make* images, not to check them.
      - name: Run pre-deploy checks
        run: node scripts/validate.js

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .          # static site, served straight from the repo root
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
